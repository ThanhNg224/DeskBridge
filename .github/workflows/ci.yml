name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftformat shellcheck xcbeautify
      - name: Verify (lint, server tests, jar build, Mac build and tests)
        run: scripts/check.sh
