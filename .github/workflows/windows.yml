name: Windows

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Server tests and DEX jar
        run: |
          scripts/test_server.sh
          scripts/build_server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-server-${{ github.sha }}
          path: server/build/deskbridge-server.jar
          if-no-files-found: error

  windows:
    needs: server
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - uses: actions/download-artifact@v4
        with:
          name: windows-server-${{ github.sha }}
          path: windows/build/server
      - name: Build and automated tests (no physical device)
        run: ./scripts/check.ps1
      - name: Ensure Inno Setup is available
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress
          }
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package experimental x64 build and installer
        run: ./scripts/package.ps1 -ServerJar ./build/server/deskbridge-server.jar -RequireInstaller
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results-${{ github.sha }}
          path: windows/TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBridge-windows-x64-${{ github.sha }}
          path: |
            windows/build/DeskBridge-windows-x64.zip
            windows/build/DeskBridge-Setup-x64.exe
          if-no-files-found: error
